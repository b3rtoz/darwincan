<line x1="520" y1="428" x2="520" y2="486" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="720" y1="428" x2="720" y2="486" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
