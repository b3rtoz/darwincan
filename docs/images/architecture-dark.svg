<text x="230" y="692" font-size="12" fill="#9198a1" font-weight="400" text-anchor="middle">ECU</text>
<line x1="330" y1="722" x2="330" y2="700" stroke="#f0883e" stroke-width="2"/>
<rect x="296" y="674" width="68" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
