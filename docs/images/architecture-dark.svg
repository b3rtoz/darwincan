<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">darwinCAN architecture</title>
<desc id="d">Any number of programs (the command-line tools, your own program through the Rust or C library, and Python through python-can) connect over a Unix socket to the darwincand daemon. The daemon does frame fan-out, filtering, timestamps, ISO-TP, the broadcast manager and J1939, and exposes interfaces: a virtual vcan0, and can0, can1 and so on for adapter channels, which its hardware backends drive over USB. The USB CAN adapter is claimed once, by the daemon, and is connected to the CAN bus.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<text x="480" y="30" font-size="15" fill="#9198a1" font-weight="400" text-anchor="middle">Any number of programs, at the same time</text>
<rect x="40" y="48" width="280" height="104" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="180" y="80" font-size="17" fill="#e6edf3" font-weight="600" text-anchor="middle">Command-line tools</text>
<text x="180" y="106" font-size="13" fill="#9198a1" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">candump · cansend · cangen</text>
<text x="180" y="127" font-size="13" fill="#9198a1" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">canplayer · isotpsend · canctl</text>
<rect x="340" y="48" width="280" height="104" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="480" y="80" font-size="17" fill="#e6edf3" font-weight="600" text-anchor="middle">Your program</text>
<text x="480" y="106" font-size="13" fill="#9198a1" font-weight="400" text-anchor="middle">Rust crate</text>
<text x="480" y="127" font-size="13" fill="#9198a1" font-weight="400" text-anchor="middle">C library with the Linux structs</text>
<rect x="640" y="48" width="280" height="104" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="780" y="80" font-size="17" fill="#e6edf3" font-weight="600" text-anchor="middle">Python</text>
<text x="780" y="106" font-size="13" fill="#9198a1" font-weight="400" text-anchor="middle">python-can interface</text>
<text x="780" y="127" font-size="13" fill="#9198a1" font-weight="400" text-anchor="middle">ISO-TP channels</text>
<line x1="180" y1="156" x2="315.0" y2="244" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="480" y1="156" x2="480.0" y2="244" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="780" y1="156" x2="645.0" y2="244" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="596" y="206" font-size="13" fill="#9198a1" font-weight="400" text-anchor="start">Unix socket</text>
<rect x="150" y="248" width="660" height="176" rx="10" fill="#0c2d6b" stroke="#58a6ff" stroke-width="2"/>
<text x="480" y="286" font-size="22" fill="#e6edf3" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">darwincand</text>
<text x="480" y="312" font-size="13.5" fill="#9198a1" font-weight="400" text-anchor="middle">the daemon: owns the adapters and shares them</text>
<rect x="172" y="336" width="148" height="34" rx="17" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
<text x="246.0" y="358" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle">Fan-out and filters</text>
<rect x="334" y="336" width="104" height="34" rx="17" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
<text x="386.0" y="358" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle">Timestamps</text>
<rect x="452" y="336" width="68" height="34" rx="17" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
<text x="486.0" y="358" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle">ISO-TP</text>
<rect x="534" y="336" width="158" height="34" rx="17" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
<text x="613.0" y="358" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle">Broadcast manager</text>
<rect x="706" y="336" width="78" height="34" rx="17" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
<text x="745.0" y="358" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle">J1939</text>
<text x="480" y="402" font-size="13" fill="#9198a1" font-weight="400" text-anchor="middle">Protocol timing runs here, on real-time threads, not in your program</text>
