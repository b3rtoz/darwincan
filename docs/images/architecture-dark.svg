<text x="250" y="546" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="middle">virtual: no hardware needed</text>
<rect x="430" y="490" width="180" height="76" rx="10" fill="#0f2f1a" stroke="#3fb950" stroke-width="1.5"/>
<text x="520" y="522" font-size="17" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">can0</text>
<text x="520" y="546" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="middle">adapter channel</text>
<rect x="630" y="490" width="180" height="76" rx="10" fill="#0f2f1a" stroke="#3fb950" stroke-width="1.5"/>
<text x="720" y="522" font-size="17" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">can1</text>
<text x="720" y="546" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="middle">adapter channel</text>
<text x="134" y="532" font-size="13" fill="#9198a1" font-weight="400" text-anchor="end">Interfaces</text>
<line x1="520" y1="570" x2="560" y2="606" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="720" y1="570" x2="680" y2="606" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="430" y="610" width="380" height="66" rx="10" fill="#3b2f00" stroke="#d29922" stroke-width="1.5"/>
<text x="620" y="637" font-size="16" fill="#e6edf3" font-weight="600" text-anchor="middle">USB CAN adapter</text>
<text x="620" y="659" font-size="12.5" fill="#9198a1" font-weight="400" text-anchor="middle">claimed once, by the daemon · PEAK, Kvaser</text>
<text x="414" y="648" font-size="13" fill="#9198a1" font-weight="400" text-anchor="end">USB</text>
<line x1="620" y1="680" x2="620" y2="716" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="150" y1="722" x2="810" y2="722" stroke="#f0883e" stroke-width="4" stroke-linecap="round"/>
